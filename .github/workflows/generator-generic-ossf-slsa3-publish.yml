name: Release avec provenance SLSA

on:
  push:
    tags: [ 'v*' ]        # ex: git tag v1.0.0 && git push --tags

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction
          npm ci && npm run build

      - name: Créer l'archive
        run: tar --exclude=.git --exclude=node_modules -czf /tmp/ShopDrop.tar.gz . && mv /tmp/ShopDrop.tar.gz .

      - name: Calculer les hash
        id: hash
        run: echo "hashes=$(sha256sum ShopDrop.tar.gz | base64 -w0)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ShopDrop
          path: ShopDrop.tar.gz

  provenance:
    needs: [build]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      upload-assets: true
