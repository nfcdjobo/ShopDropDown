services:

  web:
    image: ${DOCKER_USER}/shopdropdown:${TAG:-latest}   # remplace build: .
    container_name: shopdropdown
    restart: unless-stopped
    expose:
      - "80"
    env_file:
      - .env
    volumes:
      - shopdropdown_storage:/var/www/app/storage/app
      - shopdropdown_logs:/var/log
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.shopdropdown.rule=Host(`shopdropdown.barriservices.com`)"
      - "traefik.http.routers.shopdropdown.entrypoints=websecure"
      - "traefik.http.routers.shopdropdown.tls.certresolver=letsencrypt"
      - "traefik.http.services.shopdropdown.loadbalancer.server.port=80"
    networks:
      - shopdropdown_net
      - traefik_net
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18
    container_name: shopdropdown_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - shopdropdown_pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shopdropdown_net

volumes:
  shopdropdown_pgdata:
  shopdropdown_storage:
  shopdropdown_logs:

networks:
  shopdropdown_net:
    driver: bridge
  traefik_net:
    external: true
